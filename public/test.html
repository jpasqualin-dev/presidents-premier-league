<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Presidents Premier League</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--page-bg);
            color: var(--text-main);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .points-card {
            position: relative;
            padding: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--card-shadow);
        }

        .points-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .points-card-title {
            color: var(--title-color);
            font-size: 1.05rem;
            font-weight: 800;
        }

        .points-card-subtitle {
            margin-top: 2px;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .points-mode-toggle {
            flex-shrink: 0;
        }

        .points-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            gap: 0;
            height: 286px;
        }

        .points-bar-column {
            display: flex;
            flex: 1 1 0;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
            padding: 0 4px;
        }

        .points-baseline {
            width: calc(100% + 8px);
            height: 3px;
            margin: 0 -4px 4px;
            border-radius: 2px;
            background-color: var(--accent-green);
        }

        .points-bar-value {
            margin-bottom: 4px;
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .points-stack {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 56px;
            border-radius: 4px 4px 0 0;
            overflow: hidden;
        }

        .points-segment {
            display: flex;
            flex: 1 1 0;
            align-items: center;
            justify-content: center;
            min-height: 0;
            background-color: var(--seg-light);
        }

        .points-crest {
            display: block;
            flex: 0 0 auto;
            object-fit: contain;
        }

        .points-bar-name {
            margin-top: 6px;
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .points-timeframes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        .points-timeframe-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background-color: var(--card-bg);
            color: var(--text-muted);
            font: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .points-timeframe-btn[aria-pressed="true"] {
            background-color: #38003c;
            border-color: #38003c;
            color: #ffffff;
        }

        .points-timeframe-btn:focus-visible,
        .toggle-btn:focus-visible {
            outline: 2px solid #38003c;
            outline-offset: 2px;
        }

        .points-status {
            margin-top: 12px;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
        }

        body.dark-mode .points-segment {
            background-color: var(--seg-dark);
        }

        body.dark-mode .points-timeframe-btn[aria-pressed="true"] {
            background-color: #c4a7ff;
            border-color: #c4a7ff;
            color: #1a1a1a;
        }

        .points-empty {
            padding: 40px 0;
            color: var(--text-muted);
            text-align: center;
        }

        .page-theme-toggle-wrap {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }

        .page-theme-toggle {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background-color: var(--card-bg);
            color: var(--text-main);
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .page-theme-toggle[aria-pressed="true"] {
            background-color: var(--brand-color);
            border-color: var(--brand-color);
            color: var(--card-bg);
        }

        .page-theme-toggle:focus-visible {
            outline: 2px solid #00a667;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <section class="points-card" aria-labelledby="points-card-title">
        <div class="points-card-header">
            <div>
                <h2 class="points-card-title" id="points-card-title">Total Points</h2>
                <div class="points-card-subtitle" id="points-card-subtitle">Loading results…</div>
            </div>
            <div class="toggle-switch points-mode-toggle" role="group" aria-label="Show total points or average points">
                <button type="button" class="toggle-btn" data-mode="PTS" aria-pressed="true">PTS</button>
                <button type="button" class="toggle-btn" data-mode="AVG" aria-pressed="false">AVG</button>
            </div>
        </div>

        <div class="points-chart" id="points-chart" role="img" aria-label="Bar chart of manager points"></div>

        <div class="points-timeframes" role="group" aria-label="Time frame">
            <button type="button" class="points-timeframe-btn" data-weeks="1" aria-pressed="false">Last 1</button>
            <button type="button" class="points-timeframe-btn" data-weeks="2" aria-pressed="false">Last 2</button>
            <button type="button" class="points-timeframe-btn" data-weeks="3" aria-pressed="false">Last 3</button>
            <button type="button" class="points-timeframe-btn" data-weeks="4" aria-pressed="false">Last 4</button>
            <button type="button" class="points-timeframe-btn" data-weeks="all" aria-pressed="true">All</button>
        </div>

        <div class="points-status" id="points-status" role="status" aria-live="polite"></div>
    </section>

    <div class="page-theme-toggle-wrap">
        <button type="button" class="theme-toggle page-theme-toggle" aria-pressed="false" aria-label="Switch to dark mode">Dark mode</button>
    </div>

    <script src="theme.js"></script>
    <script src="team-names.js"></script>
    <script src="league-config.js"></script>
    <script src="match-data.js"></script>
    <script>
        const { draftData, ownersByTeam } = PplLeagueConfig;
        const managers = Object.keys(draftData);
        const state = { mode: 'PTS', timeframe: 'all', matches: null };
        const BAR_MAX_PX = 247;
        const CREST_MAX_PX = 36;
        const MIN_CREST_PX = 8;

        // Team palettes from EPL_Team_Colors_Light_Dark_2026-27.xlsx (Primary, Secondary, Third).
        // light/dark are the palette indexes for the "Use on Light/Dark Mode" role.
        const teamColors = {
            'Arsenal': { palette: ['#EF0107', '#FFFFFF', '#9C824A'], light: 0, dark: 1 },
            'Aston Villa': { palette: ['#670E36', '#95BFE5', '#FEE505'], light: 0, dark: 1 },
            'AFC Bournemouth': { palette: ['#DA291C', '#FFFFFF', '#000000'], light: 0, dark: 1 },
            'Brentford': { palette: ['#E30613', '#FFFFFF', '#000000'], light: 0, dark: 1 },
            'Brighton & Hove Albion': { palette: ['#0057B8', '#FFFFFF', '#FFCD00'], light: 0, dark: 1 },
            'Chelsea': { palette: ['#034694', '#FFFFFF', '#DBA111'], light: 0, dark: 1 },
            'Coventry City': { palette: ['#59CBE8', '#1D2D4F', '#FFFFFF'], light: 1, dark: 0 },
            'Crystal Palace': { palette: ['#1B458F', '#C4122E', '#FFFFFF'], light: 0, dark: 1 },
            'Everton': { palette: ['#003399', '#FFFFFF', '#00205B'], light: 0, dark: 1 },
            'Fulham': { palette: ['#FFFFFF', '#000000', '#CC0000'], light: 1, dark: 0 },
            'Hull City': { palette: ['#F5A12D', '#000000', '#FFFFFF'], light: 1, dark: 0 },
            'Ipswich Town': { palette: ['#0044A9', '#FFFFFF', '#DE2C37'], light: 0, dark: 1 },
            'Leeds United': { palette: ['#FFFFFF', '#1D428A', '#FFCD00'], light: 1, dark: 0 },
            'Liverpool': { palette: ['#C8102E', '#FFFFFF', '#F6EB61'], light: 0, dark: 1 },
            'Manchester City': { palette: ['#6CABDD', '#1C2C5B', '#FFFFFF'], light: 1, dark: 0 },
            'Manchester United': { palette: ['#DA291C', '#FFFFFF', '#000000'], light: 0, dark: 1 },
            'Newcastle United': { palette: ['#241F20', '#FFFFFF', '#41B6E6'], light: 0, dark: 1 },
            'Nottingham Forest': { palette: ['#DD0000', '#FFFFFF', '#000000'], light: 0, dark: 1 },
            'Sunderland': { palette: ['#EB172B', '#FFFFFF', '#211E1F'], light: 0, dark: 1 },
            'Tottenham Hotspur': { palette: ['#FFFFFF', '#132257', '#B6A66E'], light: 1, dark: 0 }
        };
        const FALLBACK_COLORS = { palette: ['#38003c', '#c4a7ff'], light: 0, dark: 1 };
        const MIN_ADJACENT_COLOR_DISTANCE = 100;

        const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));

        const isFinished = match => match?.status === 'FINISHED' && match.matchday != null;

        function pointsForResult(scored, conceded) {
            if (scored > conceded) return 3;
            if (scored === conceded) return 1;
            return 0;
        }

        function canonicalTeam(name) {
            const value = String(name || '');
            return Object.keys(ownersByTeam).find(team => value === team || value.toLowerCase().includes(team.toLowerCase())) || null;
        }

        function buildWeekTotals(matches) {
            const weekTotals = new Map();
            matches.filter(isFinished).forEach(match => {
                const week = Number(match.matchday);
                const homeScore = match.score?.fullTime?.home ?? 0;
                const awayScore = match.score?.fullTime?.away ?? 0;
                const totals = weekTotals.get(week) || new Map();
                [
                    [canonicalTeam(match.homeTeam?.name), pointsForResult(homeScore, awayScore)],
                    [canonicalTeam(match.awayTeam?.name), pointsForResult(awayScore, homeScore)]
                ].forEach(([team, points]) => {
                    if (team) totals.set(team, (totals.get(team) || 0) + points);
                });
                weekTotals.set(week, totals);
            });
            return weekTotals;
        }

        function computeManagerRows(matches, timeframe) {
            const weekTotals = buildWeekTotals(matches || []);
            const allWeeks = [...weekTotals.keys()].sort((left, right) => left - right);
            const weeks = timeframe === 'all' ? allWeeks : allWeeks.slice(-Number(timeframe));
            const teamPoints = new Map(Object.keys(ownersByTeam).map(team => [team, 0]));
            weeks.forEach(week => weekTotals.get(week).forEach((points, team) => teamPoints.set(team, teamPoints.get(team) + points)));
            const divisor = weeks.length || 1;
            const rows = managers.map(manager => {
                const teams = draftData[manager].map(team => {
                    const PTS = teamPoints.get(team) || 0;
                    return { team, PTS, AVG: PTS / divisor };
                });
                const PTS = teams.reduce((sum, entry) => sum + entry.PTS, 0);
                return { manager, teams, PTS, AVG: PTS / divisor };
            });
            const sortKey = state.mode === 'AVG' ? 'AVG' : 'PTS';
            rows.sort((left, right) => right[sortKey] - left[sortKey] || left.manager.localeCompare(right.manager));
            return { rows, weeks };
        }


        function colorDistance(first, second) {
            const channels = hex => [1, 3, 5].map(offset => parseInt(hex.slice(offset, offset + 2), 16));
            return Math.hypot(...channels(first).map((value, index) => value - channels(second)[index]));
        }

        // Walks the stack top to bottom. A segment keeps its preferred color unless it is too close to the
        // visible segment above it, in which case it uses the team's next palette color that contrasts.
        function assignSegmentColors(entries, role) {
            let previous = null;
            return entries.map(entry => {
                const colors = teamColors[entry.team] || FALLBACK_COLORS;
                const preferred = colors.palette[colors[role]];
                const candidates = [preferred, ...colors.palette.filter(hex => hex !== preferred)];
                const chosen = previous && colorDistance(preferred, previous) < MIN_ADJACENT_COLOR_DISTANCE
                    ? candidates.find(hex => colorDistance(hex, previous) >= MIN_ADJACENT_COLOR_DISTANCE) || preferred
                    : preferred;
                if (entry.points > 0) previous = chosen;
                return chosen;
            });
        }

        function formatValue(value, mode) {
            return mode === 'AVG' ? value.toFixed(2) : String(value);
        }

        function render() {
            const chart = document.getElementById('points-chart');
            const title = document.getElementById('points-card-title');
            const subtitle = document.getElementById('points-card-subtitle');
            const status = document.getElementById('points-status');

            title.textContent = state.mode === 'AVG' ? 'Average Points' : 'Total Points';
            document.querySelectorAll('.toggle-btn').forEach(button => {
                const active = button.dataset.mode === state.mode;
                button.classList.toggle('active', active);
                button.setAttribute('aria-pressed', String(active));
            });
            document.querySelectorAll('.points-timeframe-btn').forEach(button => {
                const active = button.dataset.weeks === state.timeframe;
                button.setAttribute('aria-pressed', String(active));
            });

            if (state.matches === null) {
                chart.innerHTML = '<div class="points-empty">Loading results…</div>';
                return;
            }

            const { rows, weeks } = computeManagerRows(state.matches, state.timeframe);
            if (!weeks.length) {
                subtitle.textContent = 'No completed weeks yet';
                chart.innerHTML = '<div class="points-empty">No completed matches yet.</div>';
                status.textContent = '';
                return;
            }

            const range = weeks.length === 1 ? `Week ${weeks[0]}` : `Weeks ${weeks[0]}–${weeks[weeks.length - 1]}`;
            subtitle.textContent = range;

            const maxValue = Math.max(...rows.map(row => row[state.mode]), 0);
            chart.innerHTML = rows.map(row => {
                const value = row[state.mode];
                const barPx = maxValue > 0 ? (value / maxValue) * BAR_MAX_PX : 0;
                const entries = [...row.teams]
                    .map(entry => ({ ...entry, points: entry[state.mode] }))
                    .sort((left, right) => left.points - right.points || left.team.localeCompare(right.team));
                const lightColors = assignSegmentColors(entries, 'light');
                const darkColors = assignSegmentColors(entries, 'dark');
                const segments = entries
                    .map((entry, index) => {
                        const points = entry.points;
                        const segmentPx = value > 0 ? (points / value) * barPx : 0;
                        const crestPx = Math.min(CREST_MAX_PX, Math.floor(segmentPx) - 4);
                        const crest = crestPx >= MIN_CREST_PX
                            ? `<img class="points-crest" src="${escapeHtml(TeamNames.crest(entry.team))}" alt="${escapeHtml(entry.team)} crest" style="width:${crestPx}px;height:${crestPx}px">`
                            : '';
                        return `<div class="points-segment" style="flex-grow:${points};--seg-light:${lightColors[index]};--seg-dark:${darkColors[index]}" title="${escapeHtml(entry.team)}: ${formatValue(points, state.mode)}">${crest}</div>`;
                    }).join('');
                return `<div class="points-bar-column"><div class="points-bar-value">${formatValue(value, state.mode)}</div><div class="points-stack" style="height:${barPx}px" title="${escapeHtml(row.manager)}: ${formatValue(value, state.mode)}">${segments}</div><div class="points-baseline" aria-hidden="true"></div><div class="points-bar-name">${escapeHtml(row.manager)}</div></div>`;
            }).join('');
            status.textContent = '';
        }

        document.querySelectorAll('.toggle-btn').forEach(button => {
            button.addEventListener('click', () => {
                state.mode = button.dataset.mode;
                render();
            });
        });
        document.querySelectorAll('.points-timeframe-btn').forEach(button => {
            button.addEventListener('click', () => {
                state.timeframe = button.dataset.weeks;
                render();
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            render();
            DataManager.subscribe(data => {
                if (data === null) {
                    document.getElementById('points-status').textContent = 'Unable to load match data.';
                    return;
                }
                state.matches = data?.matches || [];
                render();
            });
            DataManager.start();
        });
    </script>
</body>
</html>
