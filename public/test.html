<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Liga de Los Presidentes - Fantasy EPL (2025/2026 Season)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #38003c;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            color: #1a1a1a;
            font-size: 2rem;
        }

        .lion-logo {
            height: 65px;
            width: auto;
            object-fit: contain;
        }

        h2 {
            margin-top: 35px;
            margin-bottom: 0;
            color: #1a1a1a;
            border-bottom: 2px solid #00ff87;
            padding-bottom: 8px;
            font-size: 1.4rem;
        }

        #status-indicator {
            padding: 12px 16px;
            border-radius: 6px;
            background-color: #e8f4fd;
            color: #0c5460;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        /* Standard Responsive Table Wrapper */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 35px;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
            background: #fff;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 6px;
            text-align: center;
            border-bottom: 1px solid #eaeaea;
        }

        th {
            background-color: #fff;
            color: #666;
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            border-bottom: 2px solid #eaeaea;
        }

        .plain-table-title {
            margin: 0;
            padding: 0 0 8px 0;
            border-bottom: none;
            font-size: 1.4rem;
            color: #1a1a1a;
            text-align: left;
        }

        .draft-title {
            font-size: 1.15rem; 
        }

        .text-left {
            text-align: left !important;
        }

        .fotmob-rank {
            width: 25px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .fotmob-player {
            text-align: left;
            font-weight: 600;
            color: #1a1a1a;
        }

        .icons-container {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .team-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            vertical-align: middle;
        }

        .team-inline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        /* Expandable Table Rows */
        .expandable-row {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .expandable-row:hover {
            background-color: #fafafa;
        }
        
        .expandable-row.expanded,
        .expandable-row.expanded:hover {
            background-color: #ffffff !important; 
        }

        .table-chevron {
            color: #a0aec0;
            font-size: 0.75rem;
            transition: transform 0.2s ease;
            margin-left: 6px;
            display: inline-block;
        }
        
        .expandable-row.expanded .table-chevron {
            transform: rotate(90deg);
        }

        .nested-table-row {
            display: none;
            background-color: #fcfcfc;
        }
