    }

    function findTeamKey(teamName, teamStats) {
        for (let teamKey in teamStats) {
            if (teamName.toLowerCase().includes(teamKey.toLowerCase()) || teamKey.toLowerCase().includes(teamName.toLowerCase())) return teamKey;
        }
        return null;
    }

    function renderJordanDashboard(playerStatsObj, teamStatsObj) {
        // 1. Render Hero Stats
        const jordanStats = playerStatsObj["Jordan"];
        document.getElementById('jordan-hero-container').style.display = 'flex';
        document.getElementById('hero-pts').textContent = jordanStats.PTS;
        document.getElementById('hero-gd').textContent = jordanStats.GD > 0 ? '+' + jordanStats.GD : jordanStats.GD;
        document.getElementById('hero-pvp').textContent = jordanStats.pvpWins;

        // 2. Render Team Roster Performance
        const teamsBody = document.getElementById('jordan-teams-body');
        teamsBody.innerHTML = '';
        
        let jordanTeams = jordanStats.teams.map(t => teamStatsObj[t]).filter(Boolean);
        jordanTeams.sort((a, b) => b.PTS - a.PTS || b.GD - a.GD || b.GF - a.GF);

        jordanTeams.forEach(t => {
            let displayName = t.team === "Manchester City" ? "Man City" : t.team;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-left">
                    <div class="team-inline">
                        ${teamLogos[t.team] ? `<img src="${teamLogos[t.team]}" class="team-icon" alt="${t.team}">` : ''}
                        ${displayName}
                    </div>
                </td>
                <td>${t.PL}</td>
                <td>${t.W}</td>
                <td>${t.D}</td>
                <td>${t.L}</td>
                <td>${t.GF}-${t.GA}</td>
                <td>${t.GD > 0 ? '+'+t.GD : t.GD}</td>
                <td><strong>${t.PTS}</strong></td>
            `;
            teamsBody.appendChild(tr);
        });

        // 3. Render Draft Value Performance
        const draftBody = document.getElementById('jordan-draft-body');
        draftBody.innerHTML = '';

        // Calculate League-wide ranks first to get accurate differences
        const allTeamsArray = Object.values(teamStatsObj).sort((a, b) => b.PTS - a.PTS || b.GD - a.GD || b.GF - a.GF);
        const teamRankMap = {};
        allTeamsArray.forEach((t, idx) => { teamRankMap[t.team] = idx + 1; });

        // Sort Jordan's teams by draft value diff
        jordanTeams.sort((a, b) => {
            const diffA = (draftPicks[a.team] || 20) - (teamRankMap[a.team] || 20);
            const diffB = (draftPicks[b.team] || 20) - (teamRankMap[b.team] || 20);
            return diffB - diffA; 
        });

        let totalDraftDiff = 0;

        jordanTeams.forEach(t => {
            const rank = teamRankMap[t.team] || 20;
            const pick = draftPicks[t.team] || 20;
            const diff = pick - rank;
            totalDraftDiff += diff;
            
            let pillClass = 'pill-gray';
            let formattedDiff = '0';
            if (diff > 0) { pillClass = 'pill-green'; formattedDiff = `+${diff}`; }
            else if (diff < 0) { pillClass = 'pill-red'; formattedDiff = `${diff}`; }

            let displayName = t.team === "Manchester City" ? "Man City" : t.team;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-left">
                    <div class="team-inline">
                        ${teamLogos[t.team] ? `<img src="${teamLogos[t.team]}" class="team-icon" alt="${t.team}">` : ''}
                        ${displayName}
                    </div>
                </td>
                <td>${rank}</td>
                <td>${pick}</td>
                <td><span class="stat-value ${pillClass}">${formattedDiff}</span></td>
            `;
            draftBody.appendChild(tr);
        });

        // Add Total Summary Row
        let totalPillClass = 'pill-gray';
        let totalFormattedDiff = '0';
        if (totalDraftDiff > 0) { totalPillClass = 'pill-green'; totalFormattedDiff = `+${totalDraftDiff}`; }
        else if (totalDraftDiff < 0) { totalPillClass = 'pill-red'; totalFormattedDiff = `${totalDraftDiff}`; }

        const summaryTr = document.createElement('tr');
        summaryTr.className = 'highlight-row';
        summaryTr.innerHTML = `
            <td class="text-left" colspan="3" style="font-weight: 800;">Jordan's Total Draft Value Difference</td>
            <td><span class="stat-value ${totalPillClass}">${totalFormattedDiff}</span></td>
        `;
        draftBody.appendChild(summaryTr);
    }

    async function fetchAndUpdateStandings() {
        let playerStats = initializePlayerStats();
        let teamStats = initializeTeamStats();
        const statusEl = document.getElementById('status-indicator');

        const cacheKey = 'pl_match_data';
        const cacheTimeKey = 'pl_match_data_time';
        const cacheDuration = 5 * 60 * 1000;

        try {
            let data;
            const now = new Date().getTime();
            const cachedTime = localStorage.getItem(cacheTimeKey);
            const cachedData = localStorage.getItem(cacheKey);

            if (cachedData && cachedTime && (now - cachedTime < cacheDuration)) {
                data = JSON.parse(cachedData);
            } else {
                const response = await fetch('/api/standings');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                data = await response.json();
                localStorage.setItem(cacheKey, JSON.stringify(data));
                localStorage.setItem(cacheTimeKey, now.toString());
            }

            let gamesProcessed = 0;

            if (data.matches) {
                data.matches.forEach(match => {
                    if (match.status === 'FINISHED') {
                        gamesProcessed++;
                        const homeTeamName = match.homeTeam.name;
                        const awayTeamName = match.awayTeam.name;
                        const homeScore = match.score.fullTime.home;
                        const awayScore = match.score.fullTime.away;

                        const homePlayer = findPlayerByTeam(homeTeamName, playerStats);
                        const awayPlayer = findPlayerByTeam(awayTeamName, playerStats);
                        const homeTeamKey = findTeamKey(homeTeamName, teamStats);
                        const awayTeamKey = findTeamKey(awayTeamName, teamStats);

                        // Update Player Stats
                        if (homePlayer) {
                            let pStat = playerStats[homePlayer];
                            pStat.PL += 1; pStat.GF += homeScore; pStat.GA += awayScore;
                            if (homeScore > awayScore) { pStat.W += 1; pStat.PTS += 3; }
                            else if (homeScore === awayScore) { pStat.D += 1; pStat.PTS += 1; }
                            else pStat.L += 1;
                        }
                        if (awayPlayer) {
                            let pStat = playerStats[awayPlayer];
                            pStat.PL += 1; pStat.GF += awayScore; pStat.GA += homeScore;
                            if (awayScore > homeScore) { pStat.W += 1; pStat.PTS += 3; }
                            else if (awayScore === homeScore) { pStat.D += 1; pStat.PTS += 1; }
                            else pStat.L += 1;
                        }

                        // PvP Logic
                        if (homePlayer && awayPlayer && homePlayer !== awayPlayer) {
                            if (homeScore > awayScore) playerStats[homePlayer].pvpWins += 1;
                            else if (awayScore > homeScore) playerStats[awayPlayer].pvpWins += 1;
                        }

                        // Update Team Stats
                        if (homeTeamKey) {
                            let t = teamStats[homeTeamKey];
                            t.PL += 1; t.GF += homeScore; t.GA += awayScore;
                            if (homeScore > awayScore) { t.W += 1; t.PTS += 3; }
                            else if (homeScore === awayScore) { t.D += 1; t.PTS += 1; }
                            else t.L += 1;
                        }
                        if (awayTeamKey) {
                            let t = teamStats[awayTeamKey];
                            t.PL += 1; t.GF += awayScore; t.GA += homeScore;
                            if (awayScore > homeScore) { t.W += 1; t.PTS += 3; }
                            else if (awayScore === homeScore) { t.D += 1; t.PTS += 1; }
                            else t.L += 1;
                        }
                    }
                });
            }

            // Calc GD
            for (let player in playerStats) { playerStats[player].GD = playerStats[player].GF - playerStats[player].GA; }
            for (let teamKey in teamStats) { teamStats[teamKey].GD = teamStats[teamKey].GF - teamStats[teamKey].GA; }

            renderJordanDashboard(playerStats, teamStats);
            statusEl.style.display = 'none';

        } catch (error) {
            console.error("Error fetching match data:", error);
            statusEl.textContent = "Unable to load data. Check console for details.";
        }
    }

    document.addEventListener('DOMContentLoaded', fetchAndUpdateStandings);
</script>
