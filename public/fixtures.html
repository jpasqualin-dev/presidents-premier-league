<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Fixtures</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fotmob-purple { background-color: #4c1d95; }
        .fotmob-purple-light { background-color: #5b21b6; }
        .score-badge { background-color: #059669; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 antialiased">

    <!-- App Container -->
    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-xl flex flex-col">

        <!-- Header Section -->
        <header class="fotmob-purple text-white p-4 pb-3">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-3">
                    <button class="p-1 rounded-full hover:bg-white/10 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">Premier League</h1>
                        <span class="text-xs text-purple-200">England</span>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="bg-purple-900/80 px-3 py-1 rounded-full text-sm font-medium flex items-center space-x-1 border border-purple-700">
                        <span>2026/27</span>
                        <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <button class="p-2 rounded-full hover:bg-white/10 transition">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Sub Navigation Tabs -->
            <div class="flex space-x-6 text-sm overflow-x-auto no-scrollbar border-b border-purple-800/50 pb-2 text-purple-200">
                <button class="hover:text-white transition">Table</button>
                <button class="text-white font-bold border-b-2 border-white pb-2 -mb-2">Fixtures</button>
                <button class="hover:text-white transition">News</button>
                <button class="hover:text-white transition">Player stats</button>
                <button class="hover:text-white transition">Teams</button>
            </div>
        </header>

        <!-- Pill Controls Bar -->
        <div class="bg-white px-4 py-3 border-b border-gray-200 flex items-center space-x-2 shadow-sm">
            <button onclick="switchView('date')" id="btn-date" class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-900 text-white transition">Date</button>
            <button onclick="switchView('round')" id="btn-round" class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition">Round</button>
            <button onclick="openTeamModal()" id="btn-team" class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 flex items-center space-x-1 transition">
                <span id="team-btn-text">Team</span>
                <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
        </div>

        <!-- Main Content Area -->
        <main id="main-content" class="p-4 space-y-4 flex-1">
            <!-- Dynamic content injected via JavaScript -->
        </main>
    </div>

    <!-- Team Selection Modal -->
    <div id="team-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex flex-col justify-end max-w-md mx-auto">
        <div class="bg-white rounded-t-2xl max-h-[85vh] flex flex-col">
            <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
                <h3 class="font-bold text-lg">Team</h3>
                <button onclick="closeTeamModal()" class="text-emerald-600 font-semibold text-sm">Done</button>
            </div>
            <div class="overflow-y-auto p-2 space-y-1">
                <!-- Team list items generated dynamically or statically -->
                <div id="modal-team-list" class="divide-y divide-gray-100">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock Data for Premier League Fixtures 2026/27
        const fixturesData = [
            { id: 1, dateGroup: "Yesterday", round: "Round 1", homeTeam: "Arsenal", homeLogo: "🔴", homeScorers: "Saka 12', Havertz 44', Jesus 78'", awayTeam: "Coventry City", awayLogo: "🔵", awayScorers: "", scoreOrTime: "3 - 0", status: "finished" },
            { id: 2, dateGroup: "Today", round: "Round 1", homeTeam: "Hull City", homeLogo: "🟠", homeScorers: "Belloumi 25', Carvalho 60'", awayTeam: "Man United", awayLogo: "🔴", awayScorers: "", scoreOrTime: "2 - 0", status: "finished" },
            { id: 3, dateGroup: "Today", round: "Round 1", homeTeam: "Everton", homeLogo: "🔷", homeScorers: "Calvert-Lewin 10', McNeil 82'", awayTeam: "Crystal Palace", awayLogo: "🦅", awayScorers: "", scoreOrTime: "2 - 0", status: "finished" },
            { id: 4, dateGroup: "Today", round: "Round 1", homeTeam: "Ipswich", homeLogo: "🚜", homeScorers: "Delap 34', Hutchinson 71'", awayTeam: "Sunderland", awayLogo: "⚪", awayScorers: "Clarke 19'", scoreOrTime: "2 - 1", status: "finished" },
            { id: 5, dateGroup: "Today", round: "Round 1", homeTeam: "Nottm Forest", homeLogo: "🌲", homeScorers: "", awayTeam: "Leeds", awayLogo: "💛", awayScorers: "Piroe 45+2'", scoreOrTime: "0 - 1", status: "finished" },
            { id: 6, dateGroup: "Today", round: "Round 1", homeTeam: "Brentford", homeLogo: "🐝", homeScorers: "Toney 14', 55', Mbeumo 89'", awayTeam: "Tottenham", awayLogo: "🐓", awayScorers: "", scoreOrTime: "3 - 0", status: "finished" },
            { id: 7, dateGroup: "Tomorrow", round: "Round 1", homeTeam: "Brighton", homeLogo: "🌊", homeScorers: "", awayTeam: "Aston Villa", awayLogo: "🦁", awayScorers: "", scoreOrTime: "8:00 AM", status: "upcoming" },
            { id: 8, dateGroup: "Tomorrow", round: "Round 1", homeTeam: "Man City", homeLogo: " sky", homeScorers: "", awayTeam: "Bournemouth", awayLogo: "🍒", awayScorers: "", scoreOrTime: "8:00 AM", status: "upcoming" },
            { id: 9, dateGroup: "Mon, Aug 31", round: "Round 2", homeTeam: "Aston Villa", homeLogo: "🦁", homeScorers: "", awayTeam: "Arsenal", awayLogo: "🔴", awayScorers: "", scoreOrTime: "2:00 PM", status: "upcoming" },
            { id: 10, dateGroup: "Sun, Sep 6", round: "Round 3", homeTeam: "Arsenal", homeLogo: "🔴", homeScorers: "", awayTeam: "Chelsea", awayLogo: "🦁", awayScorers: "", scoreOrTime: "10:30 AM", status: "upcoming" },
            { id: 11, dateGroup: "Sat, Sep 12", round: "Round 4", homeTeam: "Sunderland", awayLogo: "🔴", homeLogo: "⚪", homeScorers: "", awayTeam: "Arsenal", awayLogo: "🔴", awayScorers: "", scoreOrTime: "2:00 PM", status: "upcoming" }
        ];

        const teamsList = [
            "AFC Bournemouth", "Arsenal", "Aston Villa", "Brentford", "Brighton & Hove Albion", 
            "Chelsea", "Coventry City", "Crystal Palace", "Everton", "Fulham", 
            "Hull City", "Ipswich Town", "Leeds United", "Liverpool", "Manchester City", 
            "Manchester United", "Newcastle United", "Nottingham Forest", "Sunderland", "Tottenham Hotspur"
        ];

        let currentView = 'date'; // 'date', 'round', 'team'
        let selectedTeam = 'Arsenal';

        function renderApp() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            // Update button styles
            document.getElementById('btn-date').className = `px-4 py-1.5 rounded-full text-sm font-medium transition ${currentView === 'date' ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`;
            document.getElementById('btn-round').className = `px-4 py-1.5 rounded-full text-sm font-medium transition ${currentView === 'round' ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`;
            document.getElementById('btn-team').className = `px-4 py-1.5 rounded-full text-sm font-medium transition ${currentView === 'team' ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`;

            if (currentView === 'date') {
                renderDateView(container);
            } else if (currentView === 'round') {
                renderRoundView(container);
            } else if (currentView === 'team') {
                renderTeamView(container);
            }
        }

        function renderDateView(container) {
            const groups = groupBy(fixturesData, 'dateGroup');
            for (const [date, fixtures] of Object.entries(groups)) {
                const section = document.createElement('div');
                section.innerHTML = `
                    <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 px-1">${date}</h2>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 divide-y divide-gray-100 overflow-hidden mb-4">
                        ${fixtures.map(f => fixtureCardHTML(f)).join('')}
                    </div>
                `;
                container.appendChild(section);
            }
        }

        function renderRoundView(container) {
            const groups = groupBy(fixturesData, 'round');
            for (const [round, fixtures] of Object.entries(groups)) {
                const section = document.createElement('div');
                section.innerHTML = `
                    <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 px-1">${round}</h2>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 divide-y divide-gray-100 overflow-hidden mb-4">
                        ${fixtures.map(f => fixtureCardHTML(f)).join('')}
                    </div>
                `;
                container.appendChild(section);
            }
        }

        function renderTeamView(container) {
            const teamFixtures = fixturesData.filter(f => f.homeTeam === selectedTeam || f.awayTeam === selectedTeam);
            
            const card = document.createElement('div');
            card.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-4 border-b border-gray-100 flex items-center space-x-3 bg-gray-50/50">
                        <span class="text-2xl">⚽</span>
                        <h2 class="font-bold text-base text-gray-900">${selectedTeam}</h2>
                    </div>
                    <div class="divide-y divide-gray-100">
                        ${teamFixtures.map(f => {
                            const dateLabel = f.dateGroup;
                            return `
                                <div class="p-3 hover:bg-gray-50 transition">
                                    <div class="text-[11px] font-semibold text-gray-400 mb-1">${dateLabel}</div>
                                    <div class="flex items-center justify-between">
                                        <!-- Home Team Stacked -->
                                        <div class="flex items-center space-x-2 w-2/5">
                                            <span class="text-lg">${f.homeLogo}</span>
                                            <div class="overflow-hidden">
                                                <div class="text-sm font-medium truncate ${f.homeTeam === selectedTeam ? 'font-bold text-purple-900' : 'text-gray-800'}">${f.homeTeam}</div>
                                                <div class="text-[10px] text-gray-400 truncate">${f.homeScorers || ''}</div>
                                            </div>
                                        </div>

                                        <!-- Score or Time -->
                                        <div class="w-1/5 text-center">
                                            ${f.status === 'finished' 
                                                ? `<span class="score-badge text-white text-xs px-2 py-0.5 rounded font-bold">${f.scoreOrTime}</span>`
                                                : `<span class="text-xs font-semibold text-gray-600 bg-gray-100 px-2 py-1 rounded">${f.scoreOrTime}</span>`
                                            }
                                        </div>

                                        <!-- Away Team Stacked -->
                                        <div class="flex items-center justify-end space-x-2 w-2/5 text-right">
                                            <div class="overflow-hidden">
                                                <div class="text-sm font-medium truncate ${f.awayTeam === selectedTeam ? 'font-bold text-purple-900' : 'text-gray-800'}">${f.awayTeam}</div>
                                                <div class="text-[10px] text-gray-400 truncate">${f.awayScorers || ''}</div>
                                            </div>
                                            <span class="text-lg">${f.awayLogo}</span>
                                        </div>
                                    </div>
                                    <div class="mt-2 text-right">
                                        <span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full font-medium">${f.round}</span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            container.appendChild(card);
        }

        function fixtureCardHTML(f) {
            return `
                <div class="p-3.5 flex items-center justify-between hover:bg-gray-50/80 transition">
                    <!-- Home Team -->
                    <div class="flex items-center space-x-2.5 w-5/12">
                        <span class="text-lg flex-shrink-0">${f.homeLogo}</span>
                        <div class="overflow-hidden">
                            <div class="text-sm font-medium text-gray-800 truncate">${f.homeTeam}</div>
                            <div class="text-[10px] text-gray-400 truncate leading-tight">${f.homeScorers}</div>
                        </div>
                    </div>

                    <!-- Score / Time Badge -->
                    <div class="w-2/13 text-center flex-shrink-0 px-1">
                        ${f.status === 'finished' 
                            ? `<span class="score-badge text-white text-xs px-2 py-1 rounded font-bold tracking-wide">${f.scoreOrTime}</span>`
                            : `<span class="text-xs font-medium text-gray-600 whitespace-nowrap">${f.scoreOrTime}</span>`
                        }
                    </div>

                    <!-- Away Team -->
                    <div class="flex items-center justify-end space-x-2.5 w-5/12 text-right">
                        <div class="overflow-hidden">
                            <div class="text-sm font-medium text-gray-800 truncate">${f.awayTeam}</div>
                            <div class="text-[10px] text-gray-400 truncate leading-tight">${f.awayScorers}</div>
                        </div>
                        <span class="text-lg flex-shrink-0">${f.awayLogo}</span>
                    </div>
                </div>
            `;
        }

        function switchView(view) {
            currentView = view;
            renderApp();
        }

        function openTeamModal() {
            const listEl = document.getElementById('modal-team-list');
            listEl.innerHTML = teamsList.map(team => `
                <button onclick="selectTeam('${team}')" class="w-full px-4 py-3 text-left hover:bg-gray-50 flex items-center space-x-3 transition">
                    <span class="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold text-gray-600">⚽</span>
                    <span class="text-sm font-medium text-gray-800">${team}</span>
                </button>
            `).join('');
            document.getElementById('team-modal').classList.remove('hidden');
        }

        function closeTeamModal() {
            document.getElementById('team-modal').classList.add('hidden');
        }

        function selectTeam(team) {
            selectedTeam = team;
            currentView = 'team';
            document.getElementById('team-btn-text').innerText = team;
            closeTeamModal();
            renderApp();
        }

        function groupBy(array, key) {
            return array.reduce((result, currentValue) => {
                (result[currentValue[key]] = result[currentValue[key]] || []).push(currentValue);
                return result;
            }, {});
        }

        // Initial Load
        renderApp();
    </script>
</body>
</html>
