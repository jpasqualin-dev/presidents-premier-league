<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Liga de Los Presidentes - Fantasy EPL (2025/2026 Season)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #38003c;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            color: #1a1a1a;
            font-size: 2rem;
        }

        .lion-logo {
            height: 65px;
            width: auto;
            object-fit: contain;
        }

        h2 {
            margin-top: 35px;
            color: #1a1a1a;
            border-bottom: 2px solid #00ff87;
            padding-bottom: 8px;
            font-size: 1.4rem;
        }

        #status-indicator {
            padding: 12px 16px;
            border-radius: 6px;
            background-color: #e8f4fd;
            color: #0c5460;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        /* Desktop Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #fff;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 6px;
            text-align: center;
            border-bottom: 1px solid #eaeaea;
        }

        th {
            background-color: transparent;
            color: #666;
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            border-bottom: 2px solid #ddd;
        }

        .text-left {
            text-align: left !important;
        }

        .fotmob-rank {
            width: 25px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .fotmob-player {
            text-align: left;
            font-weight: 600;
            color: #1a1a1a;
        }

        .icons-container {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .team-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            vertical-align: middle;
        }

        .team-inline {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        th button {
            background: none;
            border: none;
            color: #666;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
            font-family: inherit;
        }

        th button:hover {
            color: #00ff87;
            text-decoration: underline;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .highlight-col {
            font-weight: bold;
            color: #38003c;
        }

        .divisions-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 15px;
        }

        .division-card {
            background: #fafafa;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 16px;
        }

        .division-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #38003c;
            border-bottom: 1px solid #38003c;
            padding-bottom: 6px;
            font-size: 1.1rem;
        }

        /* ---------------------------------------------------
           MOBILE RESPONSIVE: TABLE-TO-CARDS LAYOUT 
           --------------------------------------------------- */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 12px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .lion-logo {
                height: 45px;
            }
            
            /* Disable any horizontal wrappers */
            .table-wrapper {
                overflow-x: visible;
            }

            /* Convert tables to block elements */
            .cards-on-mobile, 
            .cards-on-mobile thead, 
            .cards-on-mobile tbody, 
            .cards-on-mobile tr, 
            .cards-on-mobile th, 
            .cards-on-mobile td {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }

            /* Hide entirely non-sortable headers on mobile */
            .cards-on-mobile thead.no-sort-mobile {
                display: none;
            }

            /* Transform sortable headers into tappable chips */
            .cards-on-mobile thead tr {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding-bottom: 15px;
                border: none;
            }

            .cards-on-mobile thead th.hide-on-mobile {
                display: none;
            }

            .cards-on-mobile thead th {
                display: inline-block;
                background-color: #e8f4fd;
                border: 1px solid #b8daff;
                border-radius: 16px;
                padding: 6px 12px;
                width: auto;
                text-align: center;
            }

            .cards-on-mobile thead th button {
                color: #0c5460;
                font-size: 0.75rem;
                text-transform: none;
            }

            /* Style rows as individual cards */
            .cards-on-mobile tbody tr {
                margin-bottom: 15px;
                border: 1px solid #e1e4e8;
                border-radius: 8px;
                background: #fff;
                box-shadow: 0 2px 5px rgba(0,0,0,0.05);
                overflow: hidden;
            }

            /* Style cells as flex containers (Label: Value) */
            .cards-on-mobile tbody td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                border-bottom: 1px solid #f4f6f8;
                text-align: right;
                font-size: 0.9rem;
            }

            .cards-on-mobile tbody td:last-child {
                border-bottom: none;
            }

            /* Inject the column label using data-label attribute */
            .cards-on-mobile tbody td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #666;
                text-transform: uppercase;
                font-size: 0.75rem;
                text-align: left;
                flex-shrink: 0;
                margin-right: 15px;
            }

            /* Highlight the top 'Header' cells of the cards */
            .cards-on-mobile tbody td[data-label="Rank"] {
                background-color: #38003c;
                color: white;
                font-weight: bold;
            }
            .cards-on-mobile tbody td[data-label="Rank"]::before {
                color: #e8f4fd;
            }
            
            .cards-on-mobile tbody td[data-label="Player"],
            .cards-on-mobile tbody td[data-label="Team (Owner)"] {
                background-color: #fafafa;
                border-bottom: 2px solid #e1e4e8;
            }

            /* Re-align icon containers for flex layout */
            .cards-on-mobile .icons-container {
                justify-content: flex-end;
            }
            .cards-on-mobile .team-inline {
                flex-direction: row-reverse;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <h1>La Liga de Los Presidentes</h1>
        <img src="https://logos-world.net/wp-content/uploads/2023/08/Premier-League-New-Logo.png" alt="Premier League Lion Logo" class="lion-logo">
    </div>

    <div id="status-indicator">Initializing 2025/2026 season data...</div>

    <h2>Overall Standings</h2>
    <div class="table-wrapper">
        <table id="standings-table" class="cards-on-mobile">
            <thead class="no-sort-mobile">
                <tr>
                    <th>#</th>
                    <th class="text-left">Player</th>
                    <th>PL</th>
                    <th>W</th>
                    <th>D</th>
                    <th>L</th>
                    <th>+/-</th>
                    <th>GD</th>
                    <th>PTS</th>
                </tr>
            </thead>
            <tbody id="standings-body">
            </tbody>
        </table>
    </div>

    <h2>Team Breakdown by Player</h2>
    <div class="table-wrapper">
        <table id="breakdown-table" class="cards-on-mobile">
            <thead class="no-sort-mobile">
                <tr>
                    <th>Rank</th>
                    <th class="text-left">Player</th>
                    <th class="text-left">Teams</th>
                    <th>Total Points</th>
                </tr>
            </thead>
            <tbody id="breakdown-body">
            </tbody>
        </table>
    </div>

    <h2>Statistics</h2>
    <div class="table-wrapper">
        <table id="secondary-table" class="cards-on-mobile">
            <thead>
                <tr>
                    <th class="hide-on-mobile">Rank</th>
                    <th class="text-left hide-on-mobile">Player</th>
                    <th><button onclick="sortSecondaryTable('goldenBoot')">Golden Boot ↕</button></th>
                    <th><button onclick="sortSecondaryTable('goldenGloves')">Golden Gloves ↕</button></th>
                    <th><button onclick="sortSecondaryTable('GD')">Goal Diff ↕</button></th>
                    <th><button onclick="sortSecondaryTable('ppm')">Pts/Match ↕</button></th>
                    <th><button onclick="sortSecondaryTable('defense')">Defense (GA/M) ↕</button></th>
                    <th><button onclick="sortSecondaryTable('offense')">Offense (GF/M) ↕</button></th>
                    <th><button onclick="sortSecondaryTable('pvpWins')">PvP Wins ↕</button></th>
                    <th><button onclick="sortSecondaryTable('pga')">PGA ↕</button></th>
                    <th><button onclick="sortSecondaryTable('ptsPga')">PTS + PGA ↕</button></th>
                </tr>
            </thead>
            <tbody id="secondary-body">
            </tbody>
        </table>
    </div>

    <h2>Divisions</h2>
    <div class="divisions-grid" id="divisions-container">
    </div>
</div>

<script>
    const draftData = {
        "Hef": ["Arsenal", "Bournemouth", "Nottingham Forest", "Hull City"],
        "Jordan": ["Manchester City", "Brighton", "Brentford", "Ipswich Town"],
        "Wes": ["Liverpool", "Newcastle", "Sunderland", "Coventry City"],
        "Nate": ["Manchester United", "Aston Villa", "Everton", "Fulham"],
        "Jamey": ["Chelsea", "Tottenham", "Crystal Palace", "Leeds United"]
    };

    const teamLogos = {
        "Arsenal": "https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg",
        "Manchester City": "https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg",
        "Liverpool": "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg",
        "Manchester United": "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg",
        "Chelsea": "https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg",
        "Tottenham": "https://upload.wikimedia.org/wikipedia/en/b/b4/Tottenham_Hotspur.svg",
        "Aston Villa": "https://crests.football-data.org/58.png",
        "Newcastle": "https://upload.wikimedia.org/wikipedia/en/5/56/Newcastle_United_Logo.svg",
        "Brighton": "https://crests.football-data.org/397.png",
        "Bournemouth": "https://upload.wikimedia.org/wikipedia/en/e/e5/AFC_Bournemouth_%282013%29.svg",
        "Nottingham Forest": "https://upload.wikimedia.org/wikipedia/en/e/e5/Nottingham_Forest_F.C._logo.svg",
        "Brentford": "https://upload.wikimedia.org/wikipedia/en/2/2a/Brentford_FC_crest.svg",
        "Sunderland": "https://upload.wikimedia.org/wikipedia/en/7/77/Logo_Sunderland.svg",
        "Everton": "https://crests.football-data.org/62.png",
        "Crystal Palace": "https://upload.wikimedia.org/wikipedia/en/a/a2/Crystal_Palace_FC_logo_%282022%29.svg",
        "Leeds United": "https://upload.wikimedia.org/wikipedia/en/5/54/Leeds_United_F.C._logo.svg",
        "Fulham": "https://upload.wikimedia.org/wikipedia/en/e/eb/Fulham_FC_%28shield%29.svg",
        "Coventry City": "https://crests.football-data.org/1076.png",
        "Ipswich Town": "https://upload.wikimedia.org/wikipedia/en/4/43/Ipswich_Town.svg",
        "Hull City": "https://upload.wikimedia.org/wikipedia/en/5/54/Hull_City_A.F.C._logo.svg"
    };

    const divisionData = {
        "Red and Blue Division": ["Arsenal", "Manchester City", "Liverpool", "Manchester United", "Chelsea"],
        "Birds and Beasts Division": ["Tottenham", "Aston Villa", "Newcastle", "Brighton", "Bournemouth"],
        "Field and Forest Division": ["Nottingham Forest", "Brentford", "Sunderland", "Everton", "Crystal Palace"],
        "Cottage and Country Division": ["Leeds United", "Fulham", "Coventry City", "Ipswich Town", "Hull City"]
    };

    let cachedPlayerStats = null;
    let cachedTeamStats = null;
    let currentSecondarySortMetric = 'ptsPga';
    let currentSecondarySortAscending = false;

    let divisionSortState = {
        "Red and Blue Division": 'PTS',
        "Birds and Beasts Division": 'PTS',
        "Field and Forest Division": 'PTS',
        "Cottage and Country Division": 'PTS'
    };

    function initializePlayerStats() {
        let stats = {};
        for (let player in draftData) {
            stats[player] = {
                player: player,
                teams: draftData[player],
                PL: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, GD: 0, PTS: 0,
                goldenBoot: 0, goldenGloves: 0, ppm: 0, defense: 0, offense: 0,
                pvpWins: 0, pga: 0, ptsPga: 0
            };
        }
        return stats;
    }

    function initializeTeamStats() {
        let stats = {};
        for (let divName in divisionData) {
            divisionData[divName].forEach(team => {
                const owner = getOwnerOfTeam(team);
                stats[team] = {
                    team: team,
                    division: divName,
                    owner: owner || "Unassigned",
                    PL: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, GD: 0, PTS: 0, PGA: 0, ptsPga: 0
                };
            });
        }
        return stats;
    }

    function getOwnerOfTeam(teamName) {
        for (let player in draftData) {
            let matched = draftData[player].some(t => 
                teamName.toLowerCase().includes(t.toLowerCase()) || 
                t.toLowerCase().includes(teamName.toLowerCase())
            );
            if (matched) return player;
        }
        return null;
    }

    function findPlayerByTeam(teamName, playerStats) {
        for (let player in playerStats) {
            let matched = playerStats[player].teams.some(t => 
                teamName.toLowerCase().includes(t.toLowerCase()) || 
                t.toLowerCase().includes(teamName.toLowerCase())
            );
            if (matched) return player;
        }
        return null;
    }

    function findTeamKey(teamName, teamStats) {
        for (let teamKey in teamStats) {
            if (teamName.toLowerCase().includes(teamKey.toLowerCase()) || teamKey.toLowerCase().includes(teamName.toLowerCase())) {
                return teamKey;
            }
        }
        return null;
    }

    function sortSecondaryTable(metric) {
        if (currentSecondarySortMetric === metric) {
            currentSecondarySortAscending = !currentSecondarySortAscending;
        } else {
            currentSecondarySortMetric = metric;
            currentSecondarySortAscending = (metric === 'defense');
        }
        if (cachedPlayerStats) {
            renderSecondaryTable(cachedPlayerStats);
        }
    }

    function toggleDivisionSort(divName, metric) {
        divisionSortState[divName] = metric;
        if (cachedTeamStats) {
            renderDivisions(cachedTeamStats);
        }
    }

    function renderPrimaryTable(playerStatsObj) {
        let playerStatsArray = Object.values(playerStatsObj);
        playerStatsArray.sort((a, b) => {
            if (b.PTS !== a.PTS) return b.PTS - a.PTS;
            if (b.GD !== a.GD) return b.GD - a.GD;
            return b.GF - a.GF;
        });

        const primaryTbody = document.getElementById('standings-body');
        primaryTbody.innerHTML = '';

        playerStatsArray.forEach((p, index) => {
            const tr = document.createElement('tr');
            
            const iconsHtml = p.teams.map(t => {
                const logoUrl = teamLogos[t] || '';
                return `<img src="${logoUrl}" class="team-icon" alt="${t} crest">`;
            }).join('');

            tr.innerHTML = `
                <td data-label="Rank" class="fotmob-rank">${index + 1}</td>
                <td data-label="Player" class="fotmob-player">
                    <div>${p.player}</div>
                    <div class="icons-container">${iconsHtml}</div>
                </td>
                <td data-label="PL">${p.PL}</td>
                <td data-label="W">${p.W}</td>
                <td data-label="D">${p.D}</td>
                <td data-label="L">${p.L}</td>
                <td data-label="+/-">${p.GF}-${p.GA}</td>
                <td data-label="GD">${p.GD > 0 ? '+' + p.GD : p.GD}</td>
                <td data-label="PTS"><strong>${p.PTS}</strong></td>
            `;
            primaryTbody.appendChild(tr);
        });
    }

    function renderBreakdownTable(playerStatsObj, teamStatsObj) {
        let playerStatsArray = Object.values(playerStatsObj);
        
        playerStatsArray.sort((a, b) => {
            if (b.PTS !== a.PTS) return b.PTS - a.PTS;
            if (b.GD !== a.GD) return b.GD - a.GD;
            return b.GF - a.GF;
        });

        const breakdownTbody = document.getElementById('breakdown-body');
        breakdownTbody.innerHTML = '';

        playerStatsArray.forEach((p, playerIndex) => {
            let playerTeams = p.teams.map(t => teamStatsObj[t]).filter(Boolean);
            playerTeams.sort((a, b) => {
                if (b.PTS !== a.PTS) return b.PTS - a.PTS;
                return b.GD - a.GD;
            });

            playerTeams.forEach((team, teamIndex) => {
                const tr = document.createElement('tr');
                const logoUrl = teamLogos[team.team] || '';
                
                const rankDisplay = teamIndex === 0 ? `<span class="fotmob-rank">${playerIndex + 1}</span>` : `<span style="color: #ccc;">-</span>`;
                const playerDisplay = teamIndex === 0 ? `<strong>${p.player}</strong>` : `<span style="color: #999;">${p.player}</span>`;
                
                tr.innerHTML = `
                    <td data-label="Rank">${rankDisplay}</td>
                    <td data-label="Player" class="text-left">${playerDisplay}</td>
                    <td data-label="Teams" class="text-left">
                        <div class="team-inline">
                            ${logoUrl ? `<img src="${logoUrl}" class="team-icon" alt="${team.team} crest">` : ''}
                            ${team.team}
                        </div>
                    </td>
                    <td data-label="Total Points"><strong>${team.PTS}</strong></td>
                `;
                breakdownTbody.appendChild(tr);
            });
        });
    }

    function renderSecondaryTable(playerStatsObj) {
        let playerStatsArray = Object.values(playerStatsObj);
        playerStatsArray.sort((a, b) => {
            let valA = a[currentSecondarySortMetric];
            let valB = b[currentSecondarySortMetric];
            if (valA !== valB) {
                return currentSecondarySortAscending ? valA - valB : valB - valA;
            }
            return b.PTS - a.PTS;
        });

        const secondaryTbody = document.getElementById('secondary-body');
        secondaryTbody.innerHTML = '';

        playerStatsArray.forEach((p, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td data-label="Rank"><strong>${index + 1}</strong></td>
                <td data-label="Player" class="text-left"><strong>${p.player}</strong></td>
                <td data-label="Golden Boot (GF)">${p.goldenBoot}</td>
                <td data-label="Golden Gloves">${p.goldenGloves}</td>
                <td data-label="Goal Diff">${p.GD > 0 ? '+' + p.GD : p.GD}</td>
                <td data-label="Pts/Match">${p.ppm.toFixed(2)}</td>
                <td data-label="Defense (GA/M)">${p.defense.toFixed(2)}</td>
                <td data-label="Offense (GF/M)">${p.offense.toFixed(2)}</td>
                <td data-label="PvP Wins">${p.pvpWins}</td>
                <td data-label="PGA">${p.pga}</td>
                <td data-label="PTS + PGA" class="highlight-col">${p.ptsPga}</td>
            `;
            secondaryTbody.appendChild(tr);
        });
    }

    function renderDivisions(teamStatsObj) {
        const container = document.getElementById('divisions-container');
        container.innerHTML = '';

        for (let divName in divisionData) {
            const divCard = document.createElement('div');
            divCard.className = 'division-card';

            const teamsInDiv = divisionData[divName].map(t => teamStatsObj[t]).filter(Boolean);
            const sortMetric = divisionSortState[divName] || 'PTS';

            teamsInDiv.sort((a, b) => {
                if (b[sortMetric] !== a[sortMetric]) {
                    return b[sortMetric] - a[sortMetric];
                }
                return b.GD - a.GD;
            });

            let tableHTML = `
                <h3>${divName}</h3>
                <div class="table-wrapper">
                    <table class="cards-on-mobile">
                        <thead>
                            <tr>
                                <th class="hide-on-mobile">Rank</th>
                                <th class="text-left hide-on-mobile">Team (Owner)</th>
                                <th class="hide-on-mobile">PL</th>
                                <th class="hide-on-mobile">W</th>
                                <th class="hide-on-mobile">D</th>
                                <th class="hide-on-mobile">L</th>
                                <th class="hide-on-mobile">GD</th>
                                <th><button onclick="toggleDivisionSort('${divName}', 'PTS')">PTS ↕</button></th>
                                <th class="hide-on-mobile">PGA</th>
                                <th><button onclick="toggleDivisionSort('${divName}', 'ptsPga')">PTS+PGA ↕</button></th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            teamsInDiv.forEach((t, idx) => {
                const logoUrl = teamLogos[t.team] || '';
                tableHTML += `
                    <tr>
                        <td data-label="Rank"><strong>${idx + 1}</strong></td>
                        <td data-label="Team (Owner)" class="text-left">
                            <span class="team-inline">
                                ${logoUrl ? `<img src="${logoUrl}" class="team-icon" alt="${t.team} crest">` : ''}
                                <strong>${t.team}</strong> <span style="font-size: 0.8rem; color: #888;">(${t.owner})</span>
                            </span>
                        </td>
                        <td data-label="PL">${t.PL}</td>
                        <td data-label="W">${t.W}</td>
                        <td data-label="D">${t.D}</td>
                        <td data-label="L">${t.L}</td>
                        <td data-label="GD">${t.GD > 0 ? '+' + t.GD : t.GD}</td>
                        <td data-label="PTS"><strong>${t.PTS}</strong></td>
                        <td data-label="PGA">${t.PGA}</td>
                        <td data-label="PTS+PGA" class="highlight-col">${t.ptsPga}</td>
                    </tr>
                `;
            });

            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;

            divCard.innerHTML = tableHTML;
            container.appendChild(divCard);
        }
    }

    async function fetchAndUpdateStandings() {
        let playerStats = initializePlayerStats();
        let teamStats = initializeTeamStats();
        const statusEl = document.getElementById('status-indicator');

        // Initial render with zeroed data
        renderPrimaryTable(playerStats);
        renderBreakdownTable(playerStats, teamStats);
        renderSecondaryTable(playerStats);
        renderDivisions(teamStats);

        const cacheKey = 'pl_match_data';
        const cacheTimeKey = 'pl_match_data_time';
        const cacheDuration = 5 * 60 * 1000;

        try {
            let data;
            const now = new Date().getTime();
            const cachedTime = localStorage.getItem(cacheTimeKey);
            const cachedData = localStorage.getItem(cacheKey);

            if (cachedData && cachedTime && (now - cachedTime < cacheDuration)) {
                data = JSON.parse(cachedData);
            } else {
                const response = await fetch('/api/standings');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                data = await response.json();
                localStorage.setItem(cacheKey, JSON.stringify(data));
                localStorage.setItem(cacheTimeKey, now.toString());
            }

            let gamesProcessed = 0;

            if (data.matches) {
                data.matches.forEach(match => {
                    if (match.status === 'FINISHED') {
                        gamesProcessed++;

                        const homeTeamName = match.homeTeam.name;
                        const awayTeamName = match.awayTeam.name;
                        const homeScore = match.score.fullTime.home;
                        const awayScore = match.score.fullTime.away;

                        const homePlayer = findPlayerByTeam(homeTeamName, playerStats);
                        const awayPlayer = findPlayerByTeam(awayTeamName, playerStats);
                        const homeTeamKey = findTeamKey(homeTeamName, teamStats);
                        const awayTeamKey = findTeamKey(awayTeamName, teamStats);

                        if (homePlayer) {
                            let pStat = playerStats[homePlayer];
                            pStat.PL += 1;
                            pStat.GF += homeScore;
                            pStat.GA += awayScore;
                            pStat.goldenBoot += homeScore;
                            if (awayScore === 0) pStat.goldenGloves += 1;

                            if (homeScore > awayScore) {
                                pStat.W += 1;
                                pStat.PTS += 3;
                            } else if (homeScore === awayScore) {
                                pStat.D += 1;
                                pStat.PTS += 1;
                            } else {
                                pStat.L += 1;
                            }
                        }

                        if (awayPlayer) {
                            let pStat = playerStats[awayPlayer];
                            pStat.PL += 1;
                            pStat.GF += awayScore;
                            pStat.GA += homeScore;
                            pStat.goldenBoot += awayScore;
                            if (homeScore === 0) pStat.goldenGloves += 1;

                            if (awayScore > homeScore) {
                                pStat.W += 1;
                                pStat.PTS += 3;
                            } else if (awayScore === homeScore) {
                                pStat.D += 1;
                                pStat.PTS += 1;
                            } else {
                                pStat.L += 1;
                            }
                        }

                        if (homePlayer && awayPlayer && homePlayer !== awayPlayer) {
                            const diff = Math.abs(homeScore - awayScore);
                            if (homeScore > awayScore) {
                                playerStats[homePlayer].pvpWins += 1;
                                playerStats[homePlayer].pga += diff;
                            } else if (awayScore > homeScore) {
                                playerStats[awayPlayer].pvpWins += 1;
                                playerStats[awayPlayer].pga += diff;
                            }
                        }

                        if (homeTeamKey) {
                            let t = teamStats[homeTeamKey];
                            t.PL += 1;
                            t.GF += homeScore;
                            t.GA += awayScore;
                            if (homeScore > awayScore) {
                                t.W += 1;
                                t.PTS += 3;
                                if (awayPlayer && awayPlayer !== t.owner) {
                                    t.PGA += (homeScore - awayScore);
                                }
                            } else if (homeScore === awayScore) {
                                t.D += 1;
                                t.PTS += 1;
                            } else {
                                t.L += 1;
                            }
                        }

                        if (awayTeamKey) {
                            let t = teamStats[awayTeamKey];
                            t.PL += 1;
                            t.GF += awayScore;
                            t.GA += homeScore;
                            if (awayScore > homeScore) {
                                t.W += 1;
                                t.PTS += 3;
                                if (homePlayer && homePlayer !== t.owner) {
                                    t.PGA += (awayScore - homeScore);
                                }
                            } else if (awayScore === homeScore) {
                                t.D += 1;
                                t.PTS += 1;
                            } else {
                                t.L += 1;
                            }
                        }
                    }
                });
            }

            for (let player in playerStats) {
                let p = playerStats[player];
                p.GD = p.GF - p.GA;
                p.ppm = p.PL > 0 ? (p.PTS / p.PL) : 0;
                p.defense = p.PL > 0 ? (p.GA / p.PL) : 0;
                p.offense = p.PL > 0 ? (p.GF / p.PL) : 0;
                p.ptsPga = p.PTS + p.pga;
            }

            for (let teamKey in teamStats) {
                let t = teamStats[teamKey];
                t.GD = t.GF - t.GA;
                t.ptsPga = t.PTS + t.PGA;
            }

            cachedPlayerStats = playerStats;
            cachedTeamStats = teamStats;

            renderPrimaryTable(playerStats);
            renderBreakdownTable(playerStats, teamStats);
            renderSecondaryTable(playerStats);
            renderDivisions(teamStats);

            statusEl.textContent = `Successfully processed 2025/2026 season data (${gamesProcessed} completed matches evaluated).`;

        } catch (error) {
            console.error("Error fetching match data:", error);
            statusEl.textContent = "Unable to load data. Check console for details.";
        }
    }

    document.addEventListener('DOMContentLoaded', fetchAndUpdateStandings);
</script>

</body>
</html>
